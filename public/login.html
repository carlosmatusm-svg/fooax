<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FOOAX · Iniciar sesión</title>
<link rel="icon" href="/img/logo-fooax.jpg">
<link rel="apple-touch-icon" href="/img/logo-fooax.jpg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F1228E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FOOAX">
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){});});}</script>
<style>
  :root{
    /* Sistema visual del lienzo «Módulos contratados FOOAX» (10-sep-2026) */
    --aurora:#F1228E; --atardecer:#FD6E29; --rio:#2563EB;
    --cielo:#ADE6ED; --riqueza:#F2BB06; --llama:#B91C1C;
    --morado:#7A3EA8;
    --tinta:#18181B; --gris:#71717A; --linea:#E4E4E7; --fondo:#FAFAFA;
    --fuente:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:"SF Mono",SFMono-Regular,Menlo,Monaco,Consolas,"Courier New",monospace;
    --grad:linear-gradient(90deg,#fd6e29,#f1228e,#7a3ea8,#324ab6);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  .hilo{position:fixed;top:0;left:0;right:0;height:3px;background:var(--grad)}
  body{
    font-family:var(--fuente);
    min-height:100vh;min-height:100dvh;color:var(--tinta);
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:var(--fondo);
  }
  .caja{
    width:100%;max-width:380px;background:#fff;
    border:1px solid var(--linea);border-radius:10px;padding:34px 28px 30px;
    display:flex;flex-direction:column;align-items:center;
  }
  .logo{
    width:72px;height:72px;border-radius:16px;object-fit:cover;margin-bottom:14px;
  }
  .marca{font-size:26px;font-weight:700;letter-spacing:.16em;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lema{color:var(--gris);font-size:12px;font-style:italic;margin:5px 0 24px;text-align:center}
  form{width:100%;display:flex;flex-direction:column}
  label{font-size:10px;font-weight:600;color:var(--gris);text-transform:uppercase;
    letter-spacing:.08em;margin:0 0 6px 2px;font-family:var(--mono)}
  input{width:100%;font:inherit;font-size:16px;padding:12px 13px;
    border:1px solid var(--linea);border-radius:8px;background:#fff;transition:border-color .15s}
  input:focus{outline:none;border-color:var(--rio);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  label:not(:first-of-type){margin-top:15px}
  button{margin-top:22px;font:inherit;font-size:15px;font-weight:600;color:#fff;
    border:none;border-radius:8px;padding:13px;cursor:pointer;background:var(--tinta);
    transition:transform .12s,filter .12s}
  button:hover{filter:brightness(1.15)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:3px solid var(--rio);outline-offset:2px}
  .error{display:none;margin-top:14px;background:#FEF2F2;color:#B91C1C;font-size:13px;
    font-weight:600;padding:10px 12px;border-radius:8px;text-align:center}
  .error.visible{display:block}
</style>
</head>
<body>
<div class="hilo"></div>
<div class="caja">
  <img class="logo" src="/img/logo-fooax.jpg" alt="FOOAX">
  <div class="marca">FOOAX</div>
  <div class="lema">Creciendo juntas, avanzando siempre</div>
  <form id="f">
    <label for="u">Usuario</label>
    <input id="u" autocomplete="username" autocapitalize="none" required>
    <label for="p">Contraseña</label>
    <input id="p" type="password" autocomplete="current-password" required>
    <button>Entrar</button>
    <div class="error" id="err"></div>
  </form>
</div>
<script>
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.classList.remove("visible");
  try {
    const r = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usuario: document.getElementById("u").value, password: document.getElementById("p").value }),
    });
    if (r.ok) { location.href = "/"; return; }
    const d = await r.json().catch(() => ({}));
    err.textContent = d.error || "No se pudo entrar. Intenta de nuevo.";
    err.classList.add("visible");
  } catch {
    err.textContent = "Sin conexión con el servidor.";
    err.classList.add("visible");
  }
});
</script>
</body>
</html>
